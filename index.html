<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e3a42" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e9fb2'/%3E%3Cpath d='M20 20 L32 44 L44 20' fill='none' stroke='%23ffffff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Vision — Reconversion</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function(){
        function show(msg){
          var r=document.getElementById('root');
          if(r && !r.hasChildNodes()){
            r.innerHTML='<pre style="padding:16px;white-space:pre-wrap;font:12px/1.5 monospace;color:#dd5f43;background:#eaf5f6">'
              +'⚠️ Erreur au chargement\n\n'+String(msg).replace(/</g,'&lt;')+'</pre>';
          }
        }
        window.addEventListener('error',function(e){ show((e.error&&e.error.stack)||e.message); });
        window.addEventListener('unhandledrejection',function(e){ show('Promesse rejetee: '+((e.reason&&(e.reason.stack||e.reason.message))||e.reason)); });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
